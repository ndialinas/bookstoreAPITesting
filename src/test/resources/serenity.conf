serenity {
    project.name = "Bookstore Serenity Tests"

    # QUIET, NORMAL, or VERBOSE
    logging = NORMAL

    # Serenity HTML report location
    outputDirectory = "target/site/serenity"

    # Capture screenshots only for failed steps/tests
    take.screenshots = FOR_FAILURES

    # Show detailed step information in the report
    reports.show.step.details = true

    console {
        # Use false for cleaner CI output
        colors = false

        # Display Serenity console headings
        headings = normal

        # Display timestamps in Serenity console output
        timestamp = true
    }
}